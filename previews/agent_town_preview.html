<style>
:root{--bg:#12141b;--bar:#1a1d27;--line:#2b3040;--text:#e2e7f2;--muted:#8d95a9;--accent:#6fd3ff;--warn:#f2c46b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.35 "Segoe UI",system-ui,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}
header{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--bar);border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:44px}
.brand{font-weight:700;letter-spacing:.04em;white-space:nowrap}
.brand b{color:var(--accent)}
.badge{font-size:12px;color:#1b1d26;background:var(--warn);border-radius:4px;padding:3px 8px;font-weight:600}
.badge.syn{background:#ff9f7a}
.spacer{flex:1}
select,button,a.btn{font:inherit;font-size:12px;color:var(--text);background:#232838;border:1px solid #363c52;border-radius:5px;padding:4px 9px;cursor:pointer;text-decoration:none}
select{max-width:300px}
button.on,a.btn.on{background:#2d4a63;border-color:#4f86ad}
#clock{font:12px Consolas,monospace;color:var(--muted);min-width:110px;text-align:right;white-space:nowrap}
#wrap{flex:1 1 auto;position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:100%;height:100%;overflow:hidden}
#stage.fixed{flex:0 0 auto;border:1px solid #2b3040;border-radius:8px}
#town{position:absolute;inset:0;width:100%;height:100%;display:block}
footer{flex:0 0 auto;height:28px;display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--bar);border-top:1px solid var(--line);font:12px Consolas,monospace;color:var(--muted);white-space:nowrap;overflow:hidden}
#ticker{overflow:hidden;text-overflow:ellipsis;color:#c5ccdb}
#errs{position:fixed;left:8px;bottom:34px;max-width:70%;background:#5a1d1d;color:#ffd0d0;font:12px Consolas,monospace;padding:6px 8px;border-radius:5px;display:none;z-index:50;white-space:pre-wrap}
#answered{position:fixed;right:8px;bottom:34px;background:#1d4a2c;color:#c8ffd8;font:12px Consolas,monospace;padding:6px 8px;border-radius:5px;display:none;z-index:50}
</style>
<script>
window.__errs = [];
window.onerror = (m, src, l, c) => { window.__errs.push(m + ' @' + (src || '').split('/').pop() + ':' + l); const e = document.getElementById('errs'); if (e) { e.style.display = 'block'; e.textContent = 'JS ERRORS:\n' + window.__errs.join('\n'); } };
</script>

/* ======================================================================
   Replay controller (preview only): feeds recorded backend events into OfficeTown.applyTask
   at their recorded relative times. Query: ?task=N  ?t=SECONDS (jump there, paused)  ?idle=1
   ?wait=1 (task 4 + a SYNTHETIC permission event, shaped like multi_ai/taskstate.py waiting())
   ?contra=1 (SYNTHETIC: Dave's evidence says ok=false)  ?select=alice|...|oma  ?look=auto|classic|night
   ?size=700x420 (fixed panel size)  ?clickask=1 (clicks OMA's "?" once)
   ====================================================================== */
(function () {
  const tasks = []; const byId = {};
  for (const line of RAW) {
    let kind = null, body = line;
    if (line.startsWith('§EVENT§')) { kind = 'event'; body = line.slice(7); } else if (line.startsWith('§REPLY§')) { kind = 'reply'; body = line.slice(7); } else continue;
    let obj; try { obj = JSON.parse(body); } catch (e) { continue; }
    if (kind === 'event') {
      let t = byId[obj.task_id]; if (!t) { t = byId[obj.task_id] = { id: obj.task_id, t0: obj.ts, items: [], text: '', status: '' }; tasks.push(t); }
      if (obj.kind === 'task') t.text = obj.detail || '';
      if (obj.kind === 'result') t.status = obj.status || '';
      t.items.push({ rel: Math.max(0, obj.ts - t.t0), type: 'event', ev: obj });
    } else {
      const t = byId[obj.task_id]; if (!t) continue;
      const last = t.items[t.items.length - 1]; t.items.push({ rel: (last ? last.rel : 0) + 0.01, type: 'reply', ev: obj });
    }
  }
  tasks.forEach(t => { t.items.sort((a, b) => a.rel - b.rel); t.end = t.items.length ? t.items[t.items.length - 1].rel : 0; });

  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const realMode = params.get('real') === '1', idleMode = params.get('idle') === '1', waitMode = params.get('wait') === '1', contra = params.get('contra') === '1';
  const synth = [];

  // SYNTHETIC permission scenario: the first worker step of the task is paused for 9 s by a permission event
  function withPermission(src) {
    const t = JSON.parse(JSON.stringify(src));
    const i = t.items.findIndex(x => x.type === 'event' && x.ev.kind === 'step' && x.ev.step && x.ev.step.status === 'RUNNING');
    if (i < 0) return t;
    const base = t.items[i], r0 = base.rel, w = base.ev.worker || base.ev.step.worker, SHIFT = 9.6;
    for (let k = i + 1; k < t.items.length; k++) t.items[k].rel += SHIFT;
    const make = (dt, kind, status, stage, ws, detail) => {
      const ev = JSON.parse(JSON.stringify(base.ev)); delete ev.step; delete ev.worker;
      Object.assign(ev, { kind, status, stage, detail, ts: base.ev.ts + dt, seq: base.ev.seq + (dt < 1 ? 0.1 : 0.2) }); ev.workers[w].state = ws;
      return { rel: r0 + dt, type: 'event', ev };
    };
    t.items.splice(i + 1, 0, make(0.6, 'permission', 'WAITING', 'permission', 'WAITING', 'Allow Oma to press Play on the YouTube video in Chrome?'),
      make(SHIFT, 'stage', 'RUNNING', 'executing', 'WORKING', 'Permission answered'));
    t.end = t.items[t.items.length - 1].rel;
    synth.push('permission event added at ' + (r0 + 0.6).toFixed(1) + ' s, resumed at ' + (r0 + SHIFT).toFixed(1) + ' s');
    return t;
  }
  if (waitMode) tasks[3] = withPermission(tasks[3]);
  if (contra) for (const t of tasks) for (const it of t.items) if (it.type === 'event' && it.ev.kind === 'evidence' && it.ev.ok === true) { it.ev = { ...it.ev, ok: false, detail: 'CONTRADICTED (synthetic): ' + it.ev.detail }; }
  if (contra) synth.push('evidence ok flipped to false');
  if (waitMode || contra) { const b = $('label'); b.className = 'badge syn'; b.textContent = 'Recorded events + SYNTHETIC: ' + synth.join('; '); }

  const size = (params.get('size') || '').match(/^(\d+)x(\d+)$/);
  if (size) { const s = $('stage'); s.classList.add('fixed'); s.style.width = size[1] + 'px'; s.style.height = size[2] + 'px'; }
  if (waitMode) window.OmaTask = { answerPrompt() { const a = $('answered'); a.style.display = 'block'; a.textContent = 'OmaTask.answerPrompt() called (stand-in for settings.html)'; } };

  const town = new OfficeTown('town', { panel: 'panel', seed: 1, look: params.get('look') || 'auto', keepAlive: !idleMode && !realMode });
  window.town = town;
  let cur = 0, ptr = 0, endAt = 0, finished = false;
  const sel = $('taskSel');
  tasks.forEach((t, i) => { const o = document.createElement('option'); o.value = String(i); o.textContent = `${i + 1} · ${t.text.length > 34 ? t.text.slice(0, 33) + '…' : t.text} (${t.status || '?'})`; sel.appendChild(o); });

  function tick(clk) {
    const T = tasks[cur]; if (!T) return;
    while (ptr < T.items.length && T.items[ptr].rel <= clk + 1e-9) { deliver(T.items[ptr]); ptr++; }
    if (!finished && clk >= endAt) { finished = true; town.setPaused(true); $('playBtn').textContent = 'Play'; $('mode').textContent = 'replay finished'; }
  }
  function deliver(it) {
    if (it.type === 'event') { town.applyTask(it.ev); const e = it.ev; $('ticker').textContent = `seq ${e.seq} · ${e.kind} · ${e.status}${e.worker ? ' · ' + e.worker : ''} · ${e.detail || ''}`; }
    else town.applyReply(it.ev);
  }
  function loadTask(i, t, autoplay) {
    cur = Math.max(0, Math.min(tasks.length - 1, i)); ptr = 0; finished = false; sel.value = String(cur);
    town.reset(1000 + cur);
    endAt = tasks[cur].end + 40;
    town.onTick = tick; tick(0);
    if (t > 0) town.advance(Math.min(t, endAt - 0.05));
    town.setPaused(!autoplay); $('playBtn').textContent = autoplay ? 'Pause' : 'Play';
    $('mode').textContent = `replay · task ${cur + 1}/${tasks.length} · ${tasks[cur].id}`;
  }
  function loadIdle(t) {
    town.reset(7); town.onTick = null; town.updateFromBackendStatus({ workers: { alice: {}, bob: {}, carol: {}, dave: {}, eve: {} } });
    if (t > 0) town.advance(t);
    $('mode').textContent = 'all idle (no task events)'; $('ticker').textContent = 'no task running · workers sit at their desks';
    town.setPaused(false); $('playBtn').textContent = 'Pause';
  }
  const tParam = params.has('t') ? Math.max(0, parseFloat(params.get('t')) || 0) : 0;
  if (idleMode) { $('idleBtn').classList.add('on'); loadIdle(tParam); }
  else if (realMode) {   // like the app: events arrive on timers, nothing keeps the loop alive
    cur = waitMode ? 3 : (parseInt(params.get('task') || '1', 10) || 1) - 1; town.reset(1000 + cur); sel.value = String(cur);
    $('mode').textContent = `real-time timers · task ${cur + 1} · no keep-alive`;
    for (const it of tasks[cur].items) setTimeout(() => deliver(it), it.rel * 1000);
  }
  else { if (waitMode) $('waitBtn').classList.add('on'); loadTask(waitMode ? 3 : (parseInt(params.get('task') || '1', 10) || 1) - 1, tParam, !params.has('t')); }
  town.render();
  if (params.get('select')) town.select(params.get('select'));
  if (params.get('clickask') === '1' && town._askRect) {
    const r = town.canvas.getBoundingClientRect(), a = town._askRect, d = town.dpr || 1;
    town.canvas.dispatchEvent(new MouseEvent('click', { bubbles: true, clientX: r.left + (a.x + a.w / 2) / d, clientY: r.top + (a.y + a.h / 3) / d }));
  }

  sel.addEventListener('change', () => { location.search = '?task=' + (+sel.value + 1); });
  $('playBtn').addEventListener('click', () => {
    if (!idleMode && finished) { loadTask(cur, 0, true); return; }
    const p = !town.paused; town.setPaused(p); $('playBtn').textContent = p ? 'Play' : 'Pause';
  });
  $('restartBtn').addEventListener('click', () => { if (idleMode) loadIdle(0); else loadTask(cur, 0, true); });
  for (const [id, s] of [['sp1', 1], ['sp4', 4]]) $(id).addEventListener('click', () => { town.timeScale = s; $('sp1').classList.toggle('on', s === 1); $('sp4').classList.toggle('on', s === 4); });
  const clk = () => { $('clock').textContent = `t = ${town.clock.toFixed(1)} s`; $('frames').textContent = `renders ${town.frames} · u ${town.u.toFixed(2)} · ${town.night ? 'night' : 'day'}`; };
  clk(); setInterval(clk, 200);
  document.documentElement.dataset.selfcheck = town.selfCheck.length ? 'FAIL: ' + town.selfCheck.join('; ') : 'ok';
  if (town.selfCheck.length) window.onerror('selfcheck: ' + town.selfCheck.join('; '), '', 0);
})();
</script>
